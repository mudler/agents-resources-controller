name: publish

# Publishes two images to GitHub Container Registry.
#
# ghcr.io/<owner>/resource-controller: the CONTROLLER. Device-attached workers
# are not containerised: a worker has to see and signal the processes
# touching the hardware, so it runs on the device host itself (see the
# README).
#
# ghcr.io/<owner>/rc-worker: the rc binary plus kubectl, for the pod worker
# that runs as a Kubernetes DaemonSet and drains/uncordons its own node via
# lease hooks. It is FROM the controller image built earlier in this same
# job, so it must be built after it.
#
# master  -> :master (and :edge, a rename-proof alias for the same image)
# v1.2.3  -> :1.2.3, :1.2, :1, :latest

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  # One publish at a time per ref; a newer push supersedes an in-flight build
  # of the same ref, but never cancels a tag build.
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Never publish an image whose tests did not pass. This reuses the same
  # workflow the PR gate runs rather than a trimmed-down copy of it.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # The branch name, as a fact: :master is that branch's tip, and a
            # second branch would get its own tag from this same line.
            type=ref,event=branch
            # edge is the same image under a name that survives a branch
            # rename — master -> main would break every consumer pinned to
            # the branch tag, and this repo has already been renamed once.
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=resource-controller
            org.opencontainers.image.description=Central controller for leasing exclusive GPU devices to agents

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The worker image is FROM ghcr.io/mudler/resource-controller:edge, so it
      # must be built after the controller push above lands a fresh :edge.
      - id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rc-worker
          tags: |
            type=ref,event=branch
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=rc-worker
            org.opencontainers.image.description=rc worker plus kubectl, for Kubernetes lease hooks

      - id: build-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/rc-worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: attest worker provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/rc-worker
          subject-digest: ${{ steps.build-worker.outputs.digest }}
          push-to-registry: true

      - name: summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "${{ steps.meta-worker.outputs.tags }}"
            echo '```'
            echo
            echo "controller digest: \`${{ steps.build.outputs.digest }}\`"
            echo "worker digest: \`${{ steps.build-worker.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
