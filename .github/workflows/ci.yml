name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The suite is cgo-free by design (modernc.org/sqlite), so -race needs
      # no extra toolchain. e2e brings up real controllers and workers over
      # loopback and is the slowest package by far — hence the long timeout.
      - name: go test -race
        run: go test ./... -race -timeout 20m
