controller_url: https://rc.internal.example
token: replace-with-worker-token
# host defaults to the machine's hostname; device IDs become <host>:<name>.
# Names should end in the GPU's index (gpu0, gpu1, ...): the worker derives
# CUDA_VISIBLE_DEVICES from that trailing integer. See README.md.

# probe_dir is where this worker looks for drop-in probe executables, run in
# sorted filename order on top of the built-ins (cpus, mem, disk, kernel, and
# nvidia-smi's vendor/model/vram/driver if it's on PATH) to gather detected
# device labels. Each probe writes one flat JSON object to stdout; a bare key
# is a host-wide fact, a "<device-name>.<key>" key is device-scoped. Optional;
# defaults to /etc/rc/probe.d.
probe_dir: /etc/rc/probe.d
# probe_interval is how often the whole probe pass (built-ins plus every
# drop-in) re-runs and pushes fresh detected labels. Optional; defaults to
# 5m. A probe that fails, times out, or emits anything other than that one
# flat JSON object costs its own labels for that pass, never the worker —
# and a probe that FAILS (as opposed to running and reporting nothing)
# leaves the labels of the devices IT covers preserved rather than cleared,
# scoped to that source alone: a broken drop-in no longer freezes host-wide
# facts on devices it has nothing to do with. See README.md.
probe_interval: 5m
# verify_dir is where this worker looks for drop-in VERIFY scripts: run in
# sorted filename order after a job's process tree is gone and BEFORE the
# terminal report that frees the device, to prove the device is actually
# clean (VRAM released, no zombie context) before the next job lands on it.
# Optional; defaults to /etc/rc/verify.d. The feature is off unless that
# directory exists: no scripts, no pass, no delay.
#
# The contract is the opposite of a probe's: the EXIT CODE is the result
# (zero means clean) and STDERR is the reason an operator reads; stdout is
# ignored. Any failure quarantines the device with reason `fault` — the one
# quarantine a proven reboot does NOT clear, so it takes an admin's explicit
# POST /v1/devices/{id}/clear to put the device back. The job's own state and
# exit code are untouched: a dirty device says nothing about the run.
#
# Each script gets RC_EVENT=verify, RC_DEVICE, RC_JOB_ID, RC_SUBMITTER and
# CUDA_VISIBLE_DEVICES in its environment, the same way a lifecycle hook
# does. RC_SUBMITTER is the submitter of the job that just finished — the
# one whose run left the device in whatever state you are about to inspect —
# so a script can name them in what it writes to stderr, or page them.
#
# A non-executable file (a README alongside the scripts) is skipped, and the
# skip is logged at WARN: `chmod -x` is the normal way to disable a drop-in,
# but a git checkout or an rsync without -p drops the exec bit by accident,
# and a safety check that silently stops running is worse than one that was
# never there. A file that cannot be stat'd at all — a dangling symlink —
# FAILS the pass instead: a script that could not run has proven nothing,
# and "proved nothing" must never be recorded as "verified clean".
verify_dir: /etc/rc/verify.d
# verify_timeout bounds any SINGLE verify script; it is killed as a process
# group and its pass counted as failed if it runs over. Optional; defaults to
# 30s. Keep it tight: this sits between a job finishing and the next job on
# the same device starting.
verify_timeout: 30s
# verify_pass_budget bounds the WHOLE pass — every script together, not each
# one's verify_timeout summed. Hitting it fails the pass (an unfinished pass
# has proven nothing) with a reason naming the budget. Optional; defaults to
# 2m.
verify_pass_budget: 2m
# sheet_dir is where this worker looks for its usage-sheet documentation:
# <sheet_dir>/host.md (host-wide, shown for every device on this host by rc
# describe) and, per device, <sheet_dir>/host.d/<device-name>.md. Either file
# being absent is not an error. Optional; defaults to /etc/rc. Each sheet is
# capped at 64KB — a worker exceeding that truncates before pushing it.
sheet_dir: /etc/rc

# hooks: is host-level defaults for the lease lifecycle hooks below. Either
# field may be omitted; an omitted field falls back to the built-in default
# (timeout: 60s, release_linger: 30s). A device's own timeout/release_linger
# overrides these per device.
hooks:
  timeout: 60s
  release_linger: 30s

devices:
  # Object form: max_runtime is a per-device runtime ceiling. The controller
  # rejects (not clamps) a job that asks for more than this, and the worker
  # enforces it as a wall-clock watchdog once a job is running. A job that
  # requests no ceiling of its own inherits this one.
  - name: gpu0
    max_runtime: 6h
    # on_acquire/on_release run (in their own process group, under the same
    # timeout supervision a job gets) when this device transitions between
    # free and held. Point them at whatever needs the VRAM out of the way —
    # here, stopping/starting a local inference server. Both are optional
    # and independent; a device can set either, neither, or both.
    on_acquire: /etc/rc/hooks/stop-localai.sh
    on_release: /etc/rc/hooks/start-localai.sh
    # release_linger delays on_release this long after a job ends before it
    # actually runs. If another job lands on this device before the linger
    # expires, the pending on_release is cancelled and that next job's own
    # on_acquire is skipped too — the device was never actually idle, so
    # stopping and restarting the service in between would be pure churn.
    # Net effect: a burst of back-to-back jobs on one device produces exactly
    # one on_acquire (before the first job) and one on_release (once the
    # device has been genuinely idle for release_linger) — not one pair per
    # job. The linger only delays the hook, never the next job: a queued job
    # starts the instant the device is free, whether or not on_release has
    # fired yet.
    #
    # IMPORTANT: on_release must be idempotent — safe to run when the
    # service it targets is already stopped. Every worker start (a fresh
    # process, a crash recovery, a plain restart) runs the on_release hook
    # of every device that declares one, once, before the worker ever polls
    # for work, specifically so a crashed or forcibly restarted worker heals
    # its own node instead of leaving a service down that a live job no
    # longer holds.
    release_linger: 45s
    # labels are this device's declared facts — operator-asserted, as
    # opposed to what a probe detects at runtime. Both are stored and both
    # show up in rc describe; a detected value for the same key wins for
    # scheduling purposes, but never overwrites or hides this one. Useful
    # for facts no probe can see on its own, like which rack a box sits in.
    labels:
      rack: r3
      tier: prod
  # Plain name form still works, exactly as before — shorthand for
  # {name: gpu1} with no ceiling and no hooks, so jobs on gpu1 run unbounded
  # unless they set their own --max-runtime, and nothing runs on acquire or
  # release.
  - gpu1
heartbeat_interval: 10s
poll_wait: 30s
