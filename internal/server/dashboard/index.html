<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>resource controller</title>
<style>
  /* A calm status board. It should be nearly quiet when the fleet is fine,
     and unmistakable when it is not — so exactly one thing on this page is
     allowed to be loud, and that is a device that has left the pool.

     Neutrals are tinted toward the mark's slate rather than pure grey, and
     nothing is pure black or pure white. */
  :root {
    --bg:#fbfbfd; --panel:#fff; --sunk:#f4f5f8;
    --ink:#16181d; --ink-2:#3f4653; --muted:#6b7280; --faint:#9aa1ab;
    --line:#e4e6ec; --line-2:#d3d7e0;
    --ready:#15803d; --busy:#b45309; --unknown:#6d28d9; --bad:#b91c1c;
    --bad-bg:#fdf3f3; --bad-line:#f0c9c9;
    --warn:#a15c07; --warn-bg:#fdf8ef;
    --accent:#c86c08;
    --shadow:0 1px 2px rgba(20,22,28,.05);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg:#16181d; --panel:#1c1f26; --sunk:#232732;
      --ink:#e8eaed; --ink-2:#c3c8d2; --muted:#949bA7; --faint:#767d8a;
      --line:#2b303b; --line-2:#3a4150;
      --ready:#4ade80; --busy:#fbbf24; --unknown:#c4b5fd; --bad:#fca5a5;
      --bad-bg:#2b1618; --bad-line:#5c2a2c;
      --warn:#fbbf24; --warn-bg:#2a2113;
      --accent:#f0913a;
      --shadow:none;
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }

  header {
    display:flex; align-items:center; gap:14px;
    padding:16px 24px; border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  header .brand { display:flex; align-items:center; gap:10px; margin-right:auto; }
  header svg { display:block; }
  h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:-.01em; }
  .live { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:7px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--ready); flex:none; }
  .live.warn .dot { background:var(--warn); }
  .live.stale .dot { background:var(--bad); }
  .live.stale { color:var(--bad); font-weight:600; }

  main { padding:24px; max-width:1060px; margin:0 auto; }

  /* Summary line: the whole fleet in one sentence, so a glance needs no
     counting. It is the first thing read and usually the only thing. */
  .summary { font-size:17px; color:var(--ink-2); margin:0 0 4px; letter-spacing:-.01em; }
  .summary b { color:var(--ink); font-weight:600; }
  .summary .bad { color:var(--bad); font-weight:600; }
  .sub { font-size:13px; color:var(--muted); margin:0 0 26px; }

  .host { margin-bottom:26px; }
  .host-name {
    font-size:12px; font-weight:600; color:var(--muted);
    letter-spacing:.06em; text-transform:uppercase;
    display:flex; align-items:baseline; gap:9px; margin-bottom:8px;
  }
  .host-note {
    font-size:12px; letter-spacing:0; text-transform:none;
    font-weight:400; color:var(--faint); cursor:pointer;
    background:none; border:0; padding:0; font-family:inherit;
  }
  .host-note:hover { color:var(--accent); text-decoration:underline; }

  .rows { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel); box-shadow:var(--shadow); }
  .row { display:flex; align-items:flex-start; gap:14px; padding:13px 16px; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .row.down { background:var(--bad-bg); }

  /* The state pip carries the state at a glance; the word beside it carries
     it for anyone who cannot separate these hues. Never colour alone. */
  .pip { width:9px; height:9px; border-radius:50%; margin-top:7px; flex:none; background:var(--faint); }
  .pip.ready { background:var(--ready); }
  .pip.busy { background:var(--busy); }
  .pip.unknown { background:var(--unknown); }
  .pip.unhealthy { background:var(--bad); }

  .body { flex:1; min-width:0; }
  .line1 { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .dev { font-size:14px; font-weight:600; letter-spacing:-.01em; }
  .state { font-size:12px; font-weight:600; letter-spacing:.02em; }
  .state.ready { color:var(--ready); } .state.busy { color:var(--busy); }
  .state.unknown { color:var(--unknown); } .state.unhealthy { color:var(--bad); }
  .spec { font-size:12px; color:var(--faint); }

  .line2 { font-size:13px; color:var(--ink-2); margin-top:3px; }
  .line2 .who { font-weight:500; }
  .line2 .dur { color:var(--muted); }

  /* The explanation for a device that has left the pool. This is the single
     most important string on the page: it is why the device is gone and it
     decides whether clearing it is safe. It gets prose treatment, room, and
     no truncation. */
  .why { margin-top:7px; padding:9px 11px; background:var(--panel); border:1px solid var(--bad-line);
         border-radius:7px; font-size:13px; color:var(--ink); }
  .why b { color:var(--bad); font-weight:600; }
  .why .txt { display:block; margin-top:2px; word-break:break-word; }

  .cmd { margin-top:5px; font-size:12px; color:var(--muted);
         overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .waits { margin-top:7px; font-size:12.5px; color:var(--muted); }
  .waits .w { display:block; }
  .waits .long { color:var(--warn); font-weight:600; }

  .right { display:flex; align-items:center; gap:8px; flex:none; }

  /* Progressive disclosure: the facts an operator scans past 95% of the time
     live behind this, so the resting page stays quiet. */
  .more { border:0; background:none; padding:2px 4px; cursor:pointer; color:var(--faint);
          font:inherit; font-size:12px; border-radius:5px; }
  .more:hover { color:var(--accent); }
  .detail { margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-2); font-size:13px; }
  .facts { display:grid; grid-template-columns:auto 1fr; gap:3px 14px; }
  .facts dt { color:var(--muted); font-size:12px; }
  .facts dd { margin:0; font-size:12.5px; word-break:break-word; }
  .facts dd .src { color:var(--faint); font-size:11px; margin-left:6px; }
  .sheet { margin-top:10px; padding:11px 13px; background:var(--sunk); border-radius:7px;
           font-size:13px; white-space:pre-wrap; word-break:break-word; color:var(--ink-2); }
  .sheet .hd { display:block; font-size:11px; color:var(--muted); text-transform:uppercase;
               letter-spacing:.06em; margin-bottom:5px; font-weight:600; }
  .agewarn { color:var(--warn); font-size:12px; margin-top:7px; }
  .hist { margin-top:10px; }
  .hist .hd { display:block; font-size:11px; color:var(--muted); text-transform:uppercase;
              letter-spacing:.06em; margin-bottom:5px; font-weight:600; }
  .hist .j { display:flex; gap:9px; align-items:baseline; font-size:12.5px; padding:2px 0; }
  .jst { font-size:11px; font-weight:600; flex:none; width:74px; }
  .jst.ok { color:var(--ready); } .jst.bad { color:var(--bad); }
  .jwho { color:var(--ink-2); flex:none; }
  .jcmd { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .jwhy { color:var(--bad); font-size:11.5px; flex:none; }

  button.act { border:1px solid var(--line-2); background:var(--panel); color:var(--ink-2);
               border-radius:7px; padding:5px 11px; font:inherit; font-size:12.5px; cursor:pointer; }
  button.act:hover { border-color:var(--accent); color:var(--accent); }
  button.act.danger { border-color:var(--bad-line); color:var(--bad); }
  button.act.foreign { color:var(--faint); }

  .empty { color:var(--muted); padding:28px 0; text-align:center; }
  .empty .hint { font-size:13px; color:var(--faint); margin-top:6px; }

  /* The identity control is a footnote, not a headline: it is set once and
     never touched again, so it must not compete with the fleet. */
  .who-bar { margin-top:28px; padding-top:16px; border-top:1px solid var(--line);
             display:flex; gap:9px; align-items:center; flex-wrap:wrap;
             font-size:13px; color:var(--muted); }
  .who-bar input { flex:0 1 240px; }
  .who-bar button { border:1px solid var(--line-2); background:var(--panel); color:var(--ink-2);
                    border-radius:7px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; }

  input { background:var(--panel); color:var(--ink); border:1px solid var(--line-2);
          border-radius:7px; padding:8px 11px; font:inherit; }
  input:focus-visible, button:focus-visible, .more:focus-visible {
    outline:2px solid var(--accent); outline-offset:2px;
  }

  #gate { padding:64px 24px; max-width:400px; margin:0 auto; }
  #gate h2 { font-size:16px; margin:0 0 6px; font-weight:600; }
  #gate p { color:var(--muted); font-size:13px; margin:0 0 18px; }
  #gate form { display:flex; gap:8px; }
  #gate input { flex:1; }
  #gate button { background:var(--ink); color:var(--bg); border:0; border-radius:7px;
                 padding:8px 15px; font:inherit; font-weight:600; cursor:pointer; }

  /* An admin session can clear and retire devices without a second token, so
     the page says so plainly rather than letting the extra power be
     invisible. */
  .badge { font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
           color:var(--accent); border:1px solid var(--accent); border-radius:100px;
           padding:1px 8px; }
  #act { font-size:13px; color:var(--muted); }
  #act.bad { color:var(--bad); font-weight:600; }
  #err { font-size:13px; color:var(--bad); }
  .hide { display:none; }
</style>
</head>
<body>
<header>
  <span class="brand">
    <!-- The mark, inlined: two jaws holding one token. currentColor so it
         belongs to the text in either palette, and no external request. -->
    <svg width="20" height="20" viewBox="0 0 64 64" role="img" aria-label="resource controller">
      <path d="M24 4H4v56h20v-8H12V12h12Z" fill="currentColor" opacity=".55"/>
      <path d="M40 4h20v56H40v-8h12V12H40Z" fill="currentColor" opacity=".55"/>
      <circle cx="32" cy="32" r="13" fill="var(--accent)"/>
    </svg>
    <h1>resource controller</h1>
  </span>
  <span id="role" class="hide"></span>
  <span id="act"></span>
  <span id="err"></span>
  <span class="live" id="live"><span class="dot"></span><span id="liveText"></span></span>
</header>

<div id="gate">
  <h2>Connect</h2>
  <p>Paste a client token. It stays in this tab and is never written to disk.</p>
  <form id="gateForm">
    <input id="token" type="password" autocomplete="off" placeholder="client token" required>
    <button type="submit">Connect</button>
  </form>
</div>

<main id="app" class="hide">
  <p class="summary" id="summary"></p>
  <p class="sub" id="sub"></p>
  <div id="fleet"></div>
  <form class="who-bar" id="whoBar">
    <label for="who">You are</label>
    <input id="who" type="text" autocomplete="off" placeholder="alice@lab">
    <button type="submit">Set</button>
    <span id="whoHint"></span>
  </form>
</main>

<script>
(function () {
  // Credentials, in one place.
  //
  // token is the CLIENT token: it reads state and kills this operator's own
  // jobs. It is the only thing that survives a reload, in sessionStorage
  // (tab-scoped, gone with the tab). Nothing stronger is ever kept.
  //
  // The admin token — which returns a device to the pool fleet-wide — is
  // never held here: clearDevice() asks for it at the moment of the click,
  // hands it to exactly one request, and drops it before any callback could
  // capture it. The credential resident in this browser is always the weaker
  // of the two.
  //
  // identity is not a credential. It is the submitter name a kill is sent
  // as, the same string `rc kill --as` sends. Held in memory only, so a
  // reload keeps the connection and forgets who you are. Note what the
  // server's check is: it compares the submitter the client claims, so this
  // guards against killing the wrong job by accident — it does not
  // authenticate who is asking.
  var token = sessionStorage.getItem("rc_token") || "";
  // role is what THIS token can do, straight from /v1/whoami. It decides
  // whether the admin actions are offered directly or ask for a second
  // token at the moment of the click. It is not itself a permission: every
  // route still checks the role server-side, so a tampered value here buys
  // nothing but a button that gets refused.
  var role = "";
  var identity = "";
  var open = {};           // device id -> details expanded
  var sheets = {};         // device id -> usage sheet, fetched on demand
  var gate = document.getElementById("gate");
  var app = document.getElementById("app");
  var err = document.getElementById("err");
  var act = document.getElementById("act");
  var pollTimer = null, freshTimer = null, es = null, lastFetchAt = null;

  document.getElementById("gateForm").addEventListener("submit", function (e) {
    e.preventDefault();
    token = document.getElementById("token").value.trim();
    sessionStorage.setItem("rc_token", token);
    start();
  });

  document.getElementById("whoBar").addEventListener("submit", function (e) {
    e.preventDefault();
    identity = document.getElementById("who").value.trim();
    renderWho();
    refresh();
  });

  function renderWho() {
    document.getElementById("whoHint").textContent =
      identity ? "— kill controls act as " + identity : "— set this to enable kill controls";
  }

  function fail(m) { err.textContent = m; }
  function actOK(m) { act.textContent = m; act.className = ""; }
  function actFail(m) { act.textContent = m; act.className = "bad"; }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  // ---- formatting ------------------------------------------------------
  //
  // Every one of these takes a number the SERVER computed. This page never
  // measures an age against its own clock: a browser with a skewed clock
  // must not be able to make a month-old label read as fresh, or a stuck
  // queue read as new. The one exception is "updated Ns ago" in the header,
  // which is the delta between two readings of this browser's own clock and
  // so is immune by construction.

  function ago(s) {
    if (s < 0) return "in the future?";
    if (s < 60) return s + "s";
    if (s < 3600) return Math.floor(s / 60) + "m";
    if (s < 86400) return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
    return Math.floor(s / 86400) + "d " + Math.floor((s % 86400) / 3600) + "h";
  }

  // Raw byte counts are the single least readable thing the probes produce:
  // disk_free_bytes=59138863104 tells nobody anything at a glance.
  function bytes(n) {
    var u = ["B", "KiB", "MiB", "GiB", "TiB", "PiB"], i = 0, v = Number(n);
    if (!isFinite(v)) return String(n);
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (v >= 100 || i === 0 ? Math.round(v) : v.toFixed(1)) + " " + u[i];
  }

  function prettyValue(key, value) {
    if (/_bytes$/.test(key)) return bytes(value);
    return value;
  }

  function prettyKey(key) { return key.replace(/_bytes$/, "").replace(/_/g, " "); }

  function labelMap(v) {
    var m = {};
    (v.device.labels || []).forEach(function (l) {
      if (!(l.key in m) || l.source === "detected") m[l.key] = l.value;
    });
    return m;
  }

  // The one-line "what is this box" summary. Two or three facts that bear on
  // a scheduling decision, not the nine chips that used to dominate the card.
  function specLine(v) {
    var m = labelMap(v), bits = [];
    if (m.gpu_model) bits.push(m.gpu_model);
    else if (m.vendor) bits.push(m.vendor);
    if (m.vram) bits.push(m.vram);
    // Deliberately NOT disk_free_bytes: it is a HOST fact, so repeating it on
    // every device of that host is the same number four times. It rides the
    // host heading instead.
    return bits.join(" · ");
  }

  // Facts that belong to the machine rather than to one of its devices, so
  // they are stated once per host instead of once per row.
  function hostSummary(views) {
    var bits = [views.length + (views.length === 1 ? " device" : " devices")];
    var m = labelMap(views[0]);
    if (m.disk_free_bytes) bits.push(bytes(m.disk_free_bytes) + " free");
    if (m.cpus) bits.push(m.cpus + " CPUs");
    return bits.join(" · ");
  }

  function shortCmd(cmd) {
    var s = (cmd || []).join(" ");
    return s.length > 96 ? s.slice(0, 96) + "…" : s;
  }

  // ---- server calls ----------------------------------------------------

  function serverError(r) {
    return r.text().then(function (body) {
      var message = "";
      try {
        var parsed = JSON.parse(body);
        if (parsed && parsed.error) {
          message = parsed.message ? parsed.error + ": " + parsed.message : parsed.error;
        }
      } catch (e) { /* not JSON: fall through to the status */ }
      return message || ("HTTP " + r.status);
    }, function () { return "HTTP " + r.status; });
  }

  function killJob(job) {
    var short = job.id.slice(0, 8);
    var what = "Kill job " + short + " on " + job.device_id + "?";
    if (job.submitter !== identity) {
      what += "\n\nIt was submitted by " + job.submitter + ", not by " + identity +
        " — the controller will refuse this unless you hold an admin token.";
    }
    if (!window.confirm(what)) return;
    actOK("killing " + short + "…");
    fetch("/v1/jobs/" + encodeURIComponent(job.id) + "/kill", {
      method: "POST",
      headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ submitter: identity })
    }).then(function (r) {
      if (r.ok) { actOK("kill requested for " + short); refresh(); return; }
      return serverError(r).then(actFail);
    }).catch(function (e) { actFail(e.message); });
  }

  // The only admin-authenticated call this page makes, and the only place an
  // admin token ever exists in this tab. Read at the click, used for one
  // request, dropped on the next line — before the response arrives, so none
  // of the callbacks below can close over a live value. Never stored, never
  // returned, never held anywhere that outlives this call.
  function clearDevice(id, why) {
    var msg = "Return " + id + " to the pool?";
    if (why) msg += "\n\nIt was taken out because:\n" + why;
    msg += "\n\nThis needs an admin token, and only works if nothing holds the device.";
    if (!window.confirm(msg)) return;

    // An admin session already holds a token that can do this, so asking for
    // a second one would be ceremony without a security gain — the stronger
    // credential is already resident either way. A client session still
    // prompts, so the token in storage stays the weaker one for anyone who
    // connected with a client token.
    if (role === "admin") {
      actOK("clearing " + id + "…");
      adminFetch("/v1/devices/" + encodeURIComponent(id) + "/clear", "POST", token,
        "cleared " + id);
      return;
    }

    var admin = window.prompt("Admin token to clear " + id + " (used once, never stored)");
    if (admin === null) return;
    admin = admin.trim();
    if (!admin) { actFail("no admin token given; nothing was sent"); return; }

    actOK("clearing " + id + "…");
    var pending = fetch("/v1/devices/" + encodeURIComponent(id) + "/clear", {
      method: "POST",
      headers: { Authorization: "Bearer " + admin }
    });
    admin = null; // dropped synchronously, while the request is still in
                  // flight: the callbacks below see null, never a token
    pending.then(function (r) {
      if (r.ok) { actOK("cleared " + id); refresh(); return; }
      return serverError(r).then(actFail);
    }).catch(function (e) { actFail(e.message); });
  }

  // adminFetch is the admin-session path: one request with the token already
  // in hand, and the controller's own words on failure.
  function adminFetch(path, method, bearer, okMessage) {
    fetch(path, { method: method, headers: { Authorization: "Bearer " + bearer } })
      .then(function (r) {
        if (r.ok) { actOK(okMessage); refresh(); return; }
        return serverError(r).then(actFail);
      }).catch(function (e) { actFail(e.message); });
  }

  // retireDevice removes a device from the fleet for good. Admin-only, and
  // the confirmation spells out what survives (job history) and what does
  // not, because unlike a kill there is nothing to undo it from.
  function retireDevice(id) {
    var msg = "Retire " + id + "?\n\n" +
      "It is removed from the fleet. Job history is kept.\n\n" +
      "If a worker still declares this device, it will come back on that " +
      "worker's next registration — remove it from the worker's config first.";
    if (!window.confirm(msg)) return;
    if (role === "admin") {
      actOK("retiring " + id + "…");
      adminFetch("/v1/devices/" + encodeURIComponent(id), "DELETE", token, "retired " + id);
      return;
    }
    var admin = window.prompt("Admin token to retire " + id + " (used once, never stored)");
    if (admin === null) return;
    admin = admin.trim();
    if (!admin) { actFail("no admin token given; nothing was sent"); return; }
    actOK("retiring " + id + "…");
    var pending = fetch("/v1/devices/" + encodeURIComponent(id), {
      method: "DELETE", headers: { Authorization: "Bearer " + admin }
    });
    admin = null;
    pending.then(function (r) {
      if (r.ok) { actOK("retired " + id); refresh(); return; }
      return serverError(r).then(actFail);
    }).catch(function (e) { actFail(e.message); });
  }

  // The usage sheet is how a host explains itself — how to reach it, what is
  // already on it, what not to run at once. It is per-device and can be long,
  // so it is fetched only when someone opens the details rather than riding
  // on every 5s poll of the whole fleet.
  function loadSheet(id, into) {
    if (sheets[id] !== undefined) { paintSheet(into, sheets[id]); return; }
    fetch("/v1/devices/" + encodeURIComponent(id) + "/describe",
          { headers: { Authorization: "Bearer " + token } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        sheets[id] = d ? { text: d.sheet || "", hostWide: !!d.sheet_is_host_wide,
                           age: d.sheet_age_seconds, jobs: d.recent_jobs || [] } : null;
        paintSheet(into, sheets[id]);
      })
      .catch(function () { sheets[id] = null; paintSheet(into, null); });
  }

  function paintSheet(into, s) {
    into.textContent = "";
    if (!s) return;

    // Recent history answers the question a single state cannot: "has this
    // box been failing?" A device that is ready right now and failed its
    // last three jobs is not the same device as one that is simply ready.
    // rc describe has always shown this; the page was throwing it away.
    if (s.jobs && s.jobs.length) {
      var hist = el("div", "hist");
      hist.appendChild(el("span", "hd", "recent jobs"));
      s.jobs.forEach(function (j) {
        var line = el("div", "j");
        var st = el("span", "jst " + (j.state === "succeeded" ? "ok" : "bad"), j.state);
        line.appendChild(st);
        line.appendChild(el("span", "jwho", j.submitter || "—"));
        var cmd = (j.command || []).join(" ");
        if (j.kind === "hold") cmd = "hold" + (j.reason ? " — " + j.reason : "");
        line.appendChild(el("span", "jcmd mono", cmd));
        if (j.kill_reason) line.appendChild(el("span", "jwhy", j.kill_reason));
        hist.appendChild(line);
      });
      into.appendChild(hist);
    }

    if (!s.text) return;
    var box = el("div", "sheet");
    var hd = el("span", "hd", (s.hostWide ? "host note" : "device note") +
      (typeof s.age === "number" ? " · updated " + ago(s.age) + " ago" : ""));
    box.appendChild(hd);
    box.appendChild(document.createTextNode(s.text));
    into.appendChild(box);
  }

  // ---- rendering -------------------------------------------------------

  function stateWord(v) {
    var s = v.device.state;
    if (s === "unhealthy") return "out of the pool";
    if (s === "unknown") return "not reporting";
    if (s === "busy") return "in use";
    return "free";
  }

  function renderRow(v, queuedFor) {
    var d = v.device;
    var down = d.state === "unhealthy";
    var row = el("div", "row" + (down ? " down" : ""));
    row.appendChild(el("span", "pip " + d.state));

    var body = el("div", "body");
    var l1 = el("div", "line1");
    // The short name reads better in a list already grouped by host, but the
    // full ID is what an operator types into `rc run -d`, so keep it one
    // hover away rather than gone.
    var devName = el("span", "dev mono", d.name || d.id);
    devName.title = d.id;
    l1.appendChild(devName);
    l1.appendChild(el("span", "state " + d.state, stateWord(v)));
    var spec = specLine(v);
    if (spec) l1.appendChild(el("span", "spec", spec));
    body.appendChild(l1);

    // Who has it and for how long — the question this page exists to answer.
    if (v.holder) {
      var l2 = el("div", "line2");
      l2.appendChild(el("span", "who", v.holder));
      if (v.kind === "hold" && v.reason) l2.appendChild(document.createTextNode(" — " + v.reason));
      l2.appendChild(el("span", "dur", " · " + ago(v.elapsed_seconds)));
      body.appendChild(l2);
    }

    // A worker that has gone quiet while still holding a lease is a ghost
    // lease: the row says "in use" but nobody is confirming it.
    if (v.heartbeat_age_seconds > 30) {
      var q = el("div", "line2");
      q.appendChild(el("span", "dur", "no contact for " + ago(v.heartbeat_age_seconds)));
      body.appendChild(q);
    }

    // The explanation. Promoted above everything else on a device that is
    // out of the pool, because it is what decides whether clearing is safe.
    if (down) {
      var why = el("div", "why");
      why.appendChild(el("b", null, "Why: "));
      why.appendChild(el("span", "txt mono", v.quarantine_reason || "no reason was recorded"));
      body.appendChild(why);
    }

    if (v.kind !== "hold" && v.command && v.command.length) {
      body.appendChild(el("div", "cmd mono", shortCmd(v.command)));
    }

    // Anything queued for this device, with how long it has waited. A wait
    // over ten minutes is called out: that is the case the old page could
    // not show at all.
    if (queuedFor.length) {
      var w = el("div", "waits");
      queuedFor.forEach(function (j) {
        var secs = j.waited;
        var line = el("span", "w" + (secs >= 600 ? " long" : ""));
        line.textContent = "waiting " + ago(secs) + " · " + j.submitter;
        w.appendChild(line);
      });
      body.appendChild(w);
    }

    var detail = el("div", "detail hide");
    body.appendChild(detail);
    if (open[d.id]) { detail.classList.remove("hide"); fillDetail(detail, v); }

    row.appendChild(body);

    var right = el("div", "right");
    if (down) {
      var clear = el("button", "act danger", "Return to pool");
      clear.type = "button";
      clear.addEventListener("click", function () { clearDevice(d.id, v.quarantine_reason); });
      right.appendChild(clear);
    }
    // Retiring is offered on anything nothing is holding: a dead card is the
    // common case, but dropping a device you removed from a worker's config
    // is just as ordinary and that device is perfectly healthy.
    if (!v.holder) {
      var retire = el("button", "act", "Retire");
      retire.type = "button";
      retire.title = "remove " + d.id + " from the fleet (admin)";
      retire.addEventListener("click", function () { retireDevice(d.id); });
      right.appendChild(retire);
    }
    if (v.job_id && identity) {
      var job = { id: v.job_id, device_id: d.id, submitter: v.holder };
      var kill = el("button", "act" + (v.holder === identity ? "" : " foreign"), "Kill");
      kill.type = "button";
      if (v.holder !== identity) kill.title = "submitted by " + v.holder +
        ": the controller refuses a kill from anyone else";
      kill.addEventListener("click", function () { killJob(job); });
      right.appendChild(kill);
    }
    var more = el("button", "more", open[d.id] ? "less ▴" : "details ▾");
    more.type = "button";
    more.addEventListener("click", function () {
      open[d.id] = !open[d.id];
      more.textContent = open[d.id] ? "less ▴" : "details ▾";
      detail.classList.toggle("hide", !open[d.id]);
      if (open[d.id]) fillDetail(detail, v);
    });
    right.appendChild(more);
    row.appendChild(right);
    return row;
  }

  // Everything an operator scans past most of the time: every label with its
  // provenance, and the host's own usage sheet.
  function fillDetail(box, v) {
    box.textContent = "";
    var labels = (v.device.labels || []).slice().sort(function (a, b) {
      return a.key < b.key ? -1 : a.key > b.key ? 1 : 0;
    });
    if (!labels.length) {
      box.appendChild(el("div", "spec", "no labels reported"));
    } else {
      var dl = el("dl", "facts");
      labels.forEach(function (l) {
        dl.appendChild(el("dt", null, prettyKey(l.key)));
        var dd = el("dd", null, prettyValue(l.key, l.value));
        dd.appendChild(el("span", "src", l.source));
        dl.appendChild(dd);
      });
      box.appendChild(dl);
    }
    // Server-computed, like every age here.
    if (typeof v.oldest_label_age_seconds === "number" && v.oldest_label_age_seconds > 3600) {
      box.appendChild(el("div", "agewarn",
        "⚠ nothing has confirmed these facts for " + ago(v.oldest_label_age_seconds)));
    }
    var sheetBox = el("div");
    box.appendChild(sheetBox);
    loadSheet(v.device.id, sheetBox);
  }

  function render(state) {
    err.textContent = "";
    connectEvents();

    var views = state.devices || [];
    var waitingBy = {};
    (state.queued || []).forEach(function (j) {
      var secs = (state.queued_waiting_seconds || {})[j.id];
      var entry = { submitter: j.submitter, waited: typeof secs === "number" ? secs : 0 };
      (waitingBy[j.device_id] = waitingBy[j.device_id] || []).push(entry);
    });

    // The fleet in one sentence. Counting cards is work; this is not.
    var free = 0, busy = 0, down = 0;
    views.forEach(function (v) {
      if (v.device.state === "unhealthy") down++;
      else if (v.device.state === "busy") busy++;
      else if (v.device.state === "ready") free++;
    });
    var sum = document.getElementById("summary");
    sum.textContent = "";
    if (!views.length) {
      sum.textContent = "No devices yet.";
    } else {
      sum.appendChild(el("b", null, String(free)));
      sum.appendChild(document.createTextNode(free === 1 ? " device free, " : " devices free, "));
      sum.appendChild(el("b", null, String(busy)));
      sum.appendChild(document.createTextNode(busy === 1 ? " in use" : " in use"));
      if (down) {
        sum.appendChild(document.createTextNode(", "));
        sum.appendChild(el("span", "bad", down + " out of the pool"));
      }
      sum.appendChild(document.createTextNode("."));
    }
    var queuedCount = (state.queued || []).length;
    document.getElementById("sub").textContent = queuedCount
      ? queuedCount + (queuedCount === 1 ? " job waiting for a device." : " jobs waiting for a device.")
      : "Nothing waiting.";

    var byHost = {};
    views.forEach(function (v) {
      var h = v.device.host || "—";
      (byHost[h] = byHost[h] || []).push(v);
    });

    var fleet = document.getElementById("fleet");
    fleet.textContent = "";
    if (!views.length) {
      var e = el("div", "empty", "No devices are registered.");
      e.appendChild(el("div", "hint", "Start a worker on a device host and it will appear here."));
      fleet.appendChild(e);
      return;
    }
    Object.keys(byHost).sort().forEach(function (h) {
      var sec = el("div", "host");
      var hd = el("div", "host-name");
      hd.appendChild(el("span", null, h));
      var hostFacts = hostSummary(byHost[h]);
      if (hostFacts) hd.appendChild(el("span", "host-note", hostFacts));
      sec.appendChild(hd);
      var rows = el("div", "rows");
      byHost[h].sort(function (a, b) {
        return a.device.id < b.device.id ? -1 : 1;
      }).forEach(function (v) {
        rows.appendChild(renderRow(v, waitingBy[v.device.id] || []));
      });
      sec.appendChild(rows);
      fleet.appendChild(sec);
    });
  }

  // ---- liveness --------------------------------------------------------

  function stopLive() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    if (freshTimer) { clearInterval(freshTimer); freshTimer = null; }
    if (es) { es.close(); es = null; }
  }

  function returnToGate() {
    stopLive();
    sessionStorage.removeItem("rc_token");
    actOK("");
    gate.classList.remove("hide");
    app.classList.add("hide");
  }

  function fetchState() {
    return fetch("/v1/state", { headers: { Authorization: "Bearer " + token } })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) {
          returnToGate();
          throw new Error("token rejected");
        }
        if (!r.ok) throw new Error("state: " + r.status);
        return r.json();
      });
  }

  // The delta between two readings of THIS browser's clock, so it is immune
  // to skew by construction — unlike every age on the wire, which the server
  // computes for exactly that reason. A controller that has gone unreachable
  // must not leave the page looking current.
  function updateFreshness() {
    var live = document.getElementById("live");
    var text = document.getElementById("liveText");
    if (!lastFetchAt) { text.textContent = "connecting…"; live.className = "live"; return; }
    var age = Math.floor((Date.now() - lastFetchAt) / 1000);
    text.textContent = age < 10 ? "live" : "updated " + ago(age) + " ago";
    live.className = "live" + (age > 30 ? " stale" : age > 10 ? " warn" : "");
  }

  function refresh() {
    return fetchState()
      .then(function (state) { lastFetchAt = Date.now(); updateFreshness(); render(state); })
      .catch(function (e) { fail(e.message); });
  }

  function connectEvents() {
    if (es) return;
    try {
      es = new EventSource("/v1/events?token=" + encodeURIComponent(token));
      es.onmessage = refresh;
      es.onerror = function () { if (!err.textContent) fail("event stream dropped; polling"); };
    } catch (e) { /* polling remains the fallback */ }
  }

  // Ask the controller what this token can do, so the page offers the actions
  // it actually has rather than finding out from a 403.
  function loadRole() {
    return fetch("/v1/whoami", { headers: { Authorization: "Bearer " + token } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { role = (d && d.role) || ""; renderRole(); })
      .catch(function () { role = ""; renderRole(); });
  }

  function renderRole() {
    var badge = document.getElementById("role");
    badge.textContent = role === "admin" ? "admin" : "";
    badge.className = role === "admin" ? "badge" : "hide";
  }

  function start() {
    stopLive();
    gate.classList.add("hide");
    app.classList.remove("hide");
    document.getElementById("who").value = identity;
    renderWho();
    lastFetchAt = null;
    updateFreshness();
    loadRole();
    refresh();
    pollTimer = setInterval(refresh, 5000);
    freshTimer = setInterval(updateFreshness, 1000);
  }

  if (token) start();
})();
</script>
</body>
</html>
